services:
  - type: web
    name: f1-stats
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev --prefix frontend && npm run build --prefix frontend && npm ci --omit=dev --prefix backend
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_NAME
        value: f1_stats
      - key: SERVE_FRONTEND
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_MAX
        value: "1000"
      - key: API_CACHE_TTL_SECONDS
        value: "300"
      - key: API_CACHE_MAX_ENTRIES
        value: "500"
      - key: FIA_MONITOR_ENABLED
        value: "true"
      - key: MONGO_URL
        sync: false
